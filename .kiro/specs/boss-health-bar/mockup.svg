<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780" font-family="monospace">
  <rect width="700" height="780" fill="#0b0b12"/>

  <text x="30" y="30" fill="#9fb6d8" font-size="13">EN CONTEXTO — canvas 640x360, la barra sobre la cabeza del jefe</text>

  <!-- ====== escena completa ====== -->
  <g transform="translate(30,44)">
    <!-- fondo arena -->
    <rect width="640" height="360" fill="#241d2e"/>
    <rect y="250" width="640" height="110" fill="#33283a"/>

    <!-- jefe 192px centrado en (320,196) -> 224..416 x, 100..292 y -->
    <rect x="224" y="100" width="192" height="192" fill="#4a4038"/>
    <rect x="248" y="126" width="56" height="40" fill="#5c5145"/>
    <rect x="336" y="126" width="56" height="40" fill="#5c5145"/>
    <circle cx="276" cy="146" r="9" fill="#ff5544"/>
    <circle cx="364" cy="146" r="9" fill="#ff5544"/>
    <rect x="266" y="200" width="108" height="16" fill="#3a3128"/>
    <rect x="266" y="228" width="108" height="16" fill="#3a3128"/>
    <text x="320" y="278" fill="#7a6a58" font-size="10" text-anchor="middle">LEGACY SERVER (sprite 192px)</text>

    <!-- heroe -->
    <rect x="54" y="244" width="48" height="48" fill="#d8dce8"/>
    <rect x="66" y="256" width="24" height="14" fill="#ff9d3a"/>

    <!-- HUD YA EXISTENTE: corazones x12..126 y10..36 -->
    <g fill="#ff5544">
      <rect x="12" y="10" width="26" height="26"/>
      <rect x="42" y="10" width="26" height="26"/>
      <rect x="72" y="10" width="26" height="26"/>
    </g>
    <rect x="102" y="10" width="26" height="26" fill="none" stroke="#5a4048" stroke-width="2"/>

    <!-- HUD YA EXISTENTE: barra especial x10..205 y42..80 -->
    <rect x="10" y="42" width="195" height="38" fill="#101528" stroke="#3d4763" stroke-width="2"/>
    <rect x="40" y="50" width="98" height="22" fill="#7de0ff"/>
    <rect x="138" y="50" width="60" height="22" fill="rgba(8,10,28,0.82)"/>
    <text x="107" y="94" fill="#5f6b85" font-size="8" text-anchor="middle">especial (ya existe)</text>

    <!-- indicador de ronda YA EXISTENTE -->
    <text x="626" y="24" fill="#ffffff" font-size="11" text-anchor="end">PROBLEMA 2/4</text>

    <!-- ===== ESTA BARRA ===== -->
    <text x="320" y="58" fill="#ffffff" font-size="9" text-anchor="middle" letter-spacing="1">LEGACY SERVER</text>
    <!-- marco: x216 y66 w208 h12, borde 2 -->
    <rect x="214" y="64" width="212" height="16" fill="#3d4763"/>
    <rect x="216" y="66" width="208" height="12" fill="rgba(8,10,28,0.82)"/>
    <!-- relleno al 75% (ronda 1 resuelta) -->
    <rect x="216" y="66" width="156" height="12" fill="#ff5544"/>
    <!-- divisores de segmento: 3 lineas a 1/4, 2/4, 3/4 -->
    <rect x="268" y="66" width="1" height="12" fill="#0b0b12"/>
    <rect x="320" y="66" width="1" height="12" fill="#0b0b12"/>
    <rect x="372" y="66" width="1" height="12" fill="#0b0b12"/>

    <!-- caja de dialogo YA EXISTENTE y232..354 -->
    <rect x="128" y="232" width="384" height="122" fill="#f0dcb4" stroke="#8a6d3f" stroke-width="2" opacity="0.92"/>
    <text x="150" y="252" fill="#4a3520" font-size="9">LEGACY SERVER</text>
    <text x="320" y="286" fill="#4a3520" font-size="12" text-anchor="middle">¡Necesitás otro servidor... YA!</text>
    <text x="440" y="344" fill="#8a6d3f" font-size="8">▼ ESPACIO</text>

    <rect width="640" height="360" fill="none" stroke="#3d4763" stroke-width="1"/>
  </g>

  <!-- callouts -->
  <g font-size="10" fill="#ffd94a">
    <line x1="436" y1="116" x2="510" y2="116" stroke="#ffd94a" stroke-width="1"/>
    <text x="514" y="119">ESTA barra — x216 y66 w208 h12</text>
  </g>

  <!-- ====== los 4 estados ====== -->
  <text x="30" y="460" fill="#9fb6d8" font-size="13">LOS 5 VALORES — targetHp = 1 - min(G.round, 3) / 4</text>

  <g transform="translate(30,478)" font-size="10">
    <!-- 100% -->
    <text x="0" y="12" fill="#cfd8ea">G.round 0 · 100%</text>
    <rect x="150" y="0" width="212" height="16" fill="#3d4763"/>
    <rect x="152" y="2" width="208" height="12" fill="#ff5544"/>
    <rect x="204" y="2" width="1" height="12" fill="#0b0b12"/><rect x="256" y="2" width="1" height="12" fill="#0b0b12"/><rect x="308" y="2" width="1" height="12" fill="#0b0b12"/>
    <text x="378" y="12" fill="#5f6b85">arranque del combate</text>

    <!-- 75% -->
    <text x="0" y="44" fill="#cfd8ea">G.round 1 ·  75%</text>
    <rect x="150" y="32" width="212" height="16" fill="#3d4763"/>
    <rect x="152" y="34" width="208" height="12" fill="rgba(8,10,28,0.82)"/>
    <rect x="152" y="34" width="156" height="12" fill="#ff5544"/>
    <rect x="204" y="34" width="1" height="12" fill="#0b0b12"/><rect x="256" y="34" width="1" height="12" fill="#0b0b12"/><rect x="308" y="34" width="1" height="12" fill="#0b0b12"/>
    <text x="378" y="44" fill="#5f6b85">resolvió el problema 1</text>

    <!-- 50% -->
    <text x="0" y="76" fill="#cfd8ea">G.round 2 ·  50%</text>
    <rect x="150" y="64" width="212" height="16" fill="#3d4763"/>
    <rect x="152" y="66" width="208" height="12" fill="rgba(8,10,28,0.82)"/>
    <rect x="152" y="66" width="104" height="12" fill="#ff5544"/>
    <rect x="204" y="66" width="1" height="12" fill="#0b0b12"/><rect x="256" y="66" width="1" height="12" fill="#0b0b12"/><rect x="308" y="66" width="1" height="12" fill="#0b0b12"/>
    <text x="378" y="76" fill="#5f6b85">resolvió el problema 2</text>

    <!-- 25% pulso -->
    <text x="0" y="108" fill="#cfd8ea">G.round 3+ ·  25%</text>
    <rect x="150" y="96" width="212" height="16" fill="#3d4763"/>
    <rect x="152" y="98" width="208" height="12" fill="rgba(8,10,28,0.82)"/>
    <rect x="152" y="98" width="52" height="12" fill="#ffd94a"/>
    <rect x="204" y="98" width="1" height="12" fill="#0b0b12"/><rect x="256" y="98" width="1" height="12" fill="#0b0b12"/><rect x="308" y="98" width="1" height="12" fill="#0b0b12"/>
    <text x="378" y="108" fill="#ffd94a">MÍNIMO — pulsa (#ff5544 ⇄ #ffd94a)</text>
    <text x="378" y="122" fill="#5f6b85">incluye ¡EL JEFE INSISTE! — nunca baja de acá</text>

    <!-- remate -->
    <text x="0" y="156" fill="#cfd8ea">FINISH_ANIM ·  0%</text>
    <rect x="150" y="144" width="212" height="16" fill="#3d4763" opacity="0.35"/>
    <rect x="152" y="146" width="208" height="12" fill="rgba(8,10,28,0.4)"/>
    <text x="378" y="156" fill="#5f6b85">se vacía por tiempo y deja de dibujarse</text>
  </g>

  <g font-size="10" fill="#ff8866">
    <text x="30" y="666">El jefe NO cae por esta barra. Cae cuando la especial del jugador llega a 100 (CLOUD_QUEST.md §5).</text>
    <text x="30" y="682">Por eso el mínimo por rondas es 25%: el último cuarto se lo saca el remate.</text>
  </g>

  <g font-size="10" fill="#5f6b85">
    <text x="30" y="716">Orden de dibujo (lo último tapa): rótulo → marco → fondo vacío → relleno → divisores</text>
    <text x="30" y="732">Todas las coordenadas con Math.round() antes de fillRect. Es pixel art.</text>
    <text x="30" y="748">Se engancha desde drawHUD.js, ANTES del loop de effects.floats (los flotantes van encima).</text>
  </g>
</svg>
