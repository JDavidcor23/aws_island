<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1300" viewBox="0 0 700 1300" font-family="monospace">
  <rect width="700" height="1300" fill="#0b0b12"/>

  <defs>
    <!-- fondo A-1: isla oxidada, suelo caminable adelante, servidor lejano -->
    <g id="bg">
      <!-- cielo -->
      <rect width="640" height="230" fill="#3b3048"/>
      <rect width="640" height="90" fill="#4a3a52"/>
      <!-- servidor LEJANO en el horizonte -->
      <rect x="470" y="96" width="52" height="104" fill="#2e2a2e"/>
      <rect x="478" y="104" width="14" height="10" fill="#3d3538"/>
      <rect x="500" y="104" width="14" height="10" fill="#3d3538"/>
      <circle cx="486" cy="130" r="3" fill="#ff5544" opacity="0.75"/>
      <circle cx="507" cy="130" r="3" fill="#ff5544" opacity="0.75"/>
      <rect x="484" y="66" width="5" height="32" fill="#4a4050" opacity="0.5"/>
      <rect x="504" y="72" width="5" height="26" fill="#4a4050" opacity="0.5"/>
      <text x="496" y="214" fill="#5a5060" font-size="7" text-anchor="middle">lejano</text>
      <!-- midground: aldea oxidada -->
      <rect y="196" width="640" height="60" fill="#39322c"/>
      <!-- molino roto -->
      <rect x="64" y="150" width="12" height="48" fill="#4a4038"/>
      <rect x="52" y="146" width="36" height="5" fill="#5c5145"/>
      <rect x="68" y="130" width="5" height="20" fill="#5c5145"/>
      <!-- casas -->
      <rect x="112" y="166" width="44" height="32" fill="#4a3f34"/>
      <rect x="108" y="158" width="52" height="9" fill="#6b4a3a"/>
      <rect x="126" y="180" width="12" height="18" fill="#2b241f"/>
      <rect x="196" y="172" width="38" height="26" fill="#453b31"/>
      <rect x="192" y="164" width="46" height="9" fill="#6b4a3a"/>
      <rect x="286" y="168" width="42" height="30" fill="#4a3f34"/>
      <rect x="282" y="160" width="50" height="9" fill="#63443a"/>
      <!-- torre de agua oxidada -->
      <rect x="366" y="152" width="26" height="18" fill="#5c4a3a"/>
      <rect x="374" y="170" width="4" height="28" fill="#4a4038"/>
      <rect x="382" y="170" width="4" height="28" fill="#4a4038"/>
      <!-- arboles muertos -->
      <rect x="248" y="170" width="4" height="28" fill="#3a3128"/>
      <rect x="240" y="168" width="20" height="3" fill="#3a3128"/>
      <rect x="424" y="174" width="4" height="24" fill="#3a3128"/>
      <!-- cables que salen del suelo hacia la derecha -->
      <rect x="0" y="252" width="640" height="3" fill="#2e2822"/>
      <rect x="180" y="240" width="460" height="3" fill="#332c26"/>
      <!-- suelo caminable -->
      <rect y="256" width="640" height="104" fill="#4a4238"/>
      <rect y="256" width="640" height="4" fill="#5c5348"/>
      <!-- losas -->
      <g fill="#413a31">
        <rect x="20" y="266" width="60" height="3"/><rect x="110" y="266" width="60" height="3"/>
        <rect x="200" y="266" width="60" height="3"/><rect x="290" y="266" width="60" height="3"/>
        <rect x="380" y="266" width="60" height="3"/><rect x="470" y="266" width="60" height="3"/>
        <rect x="560" y="266" width="60" height="3"/>
      </g>
      <g fill="#3d362e">
        <rect x="60" y="316" width="70" height="3"/><rect x="170" y="316" width="70" height="3"/>
        <rect x="280" y="316" width="70" height="3"/><rect x="390" y="316" width="70" height="3"/>
        <rect x="500" y="316" width="70" height="3"/>
      </g>
    </g>

    <!-- pinguino 72px, pies en y=300 -->
    <g id="peng">
      <ellipse cx="430" cy="264" rx="22" ry="26" fill="#f2efe6"/>
      <path d="M408 258 a22 26 0 0 1 44 0 a22 26 0 0 1 -44 0 z" fill="#1d1d22"/>
      <ellipse cx="430" cy="268" rx="15" ry="20" fill="#f2efe6"/>
      <circle cx="424" cy="252" r="2.5" fill="#1d1d22"/>
      <circle cx="437" cy="252" r="2.5" fill="#1d1d22"/>
      <polygon points="430,256 436,260 430,264" fill="#ff9d3a"/>
      <rect x="412" y="272" width="36" height="6" fill="#c8322e"/>
      <rect x="446" y="276" width="5" height="8" fill="#c8322e"/>
      <rect x="452" y="248" width="3" height="46" fill="#8a6a48"/>
      <rect x="422" y="296" width="7" height="4" fill="#ff9d3a"/>
      <rect x="432" y="296" width="7" height="4" fill="#ff9d3a"/>
    </g>

    <!-- heroe 96px, pies en y=300 -->
    <g id="hero">
      <rect x="-14" y="-52" width="28" height="24" fill="#1d1d22"/>
      <rect x="-11" y="-38" width="22" height="16" fill="#e8c8a8"/>
      <circle cx="-4" cy="-32" r="2" fill="#1d1d22"/>
      <circle cx="5" cy="-32" r="2" fill="#1d1d22"/>
      <rect x="-15" y="-22" width="30" height="26" fill="#f2f0ea"/>
      <rect x="-8" y="-15" width="16" height="10" fill="#ff9d3a"/>
      <text x="0" y="-7" fill="#1d1d22" font-size="6" text-anchor="middle">AWS</text>
      <rect x="-13" y="4" width="26" height="20" fill="#3d5a8a"/>
      <rect x="-13" y="24" width="11" height="6" fill="#5a3d28"/>
      <rect x="2" y="24" width="11" height="6" fill="#5a3d28"/>
    </g>
  </defs>

  <!-- ============ PASO 1: WALK_IN ============ -->
  <text x="30" y="28" fill="#9fb6d8" font-size="13">PASO 1 — WALK_IN · el héroe entra caminando, SIN input</text>

  <g transform="translate(30,40)">
    <use href="#bg"/>
    <use href="#peng"/>
    <!-- heroe entrando, casi fuera del borde -->
    <g transform="translate(24,300)" opacity="0.95"><use href="#hero"/></g>
    <!-- flecha de movimiento -->
    <g stroke="#ffd94a" stroke-width="2" fill="none">
      <line x1="46" y1="286" x2="96" y2="286"/>
      <polyline points="88,281 96,286 88,291"/>
    </g>
    <text x="104" y="290" fill="#ffd94a" font-size="9">heroX: -40 → 180 · WALK_SPEED 92 px/s</text>
    <!-- linea de piso -->
    <line x1="0" y1="300" x2="640" y2="300" stroke="#7de0ff" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="636" y="313" fill="#7de0ff" font-size="8" text-anchor="end">GROUND_Y = 300 — acá apoyan los PIES</text>
    <!-- hint -->
    <text x="628" y="24" fill="#9fb6d8" font-size="9" text-anchor="end">T para saltear</text>
    <rect width="640" height="360" fill="none" stroke="#3d4763" stroke-width="1"/>
  </g>

  <g font-size="10" fill="#ff8866">
    <text x="30" y="424">Ciclo de caminata: hero_walk_1..6 a 10 fps. ⚠️ Los 6 frames NO estaban en ASSETS_MANIFEST.js.</text>
  </g>

  <!-- ============ PASO 2: TALK ============ -->
  <text x="30" y="462" fill="#9fb6d8" font-size="13">PASO 2 — TALK · ESPACIO avanza las 5 líneas · el pingüino se mueve al hablar</text>

  <g transform="translate(30,474)">
    <use href="#bg"/>
    <!-- pinguino con bob -->
    <g transform="translate(0,-3)"><use href="#peng"/></g>
    <!-- heroe quieto en el punto de encuentro -->
    <g transform="translate(180,300)"><use href="#hero"/></g>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#7de0ff" stroke-width="1" stroke-dasharray="5 4" opacity="0.4"/>
    <text x="180" y="318" fill="#7de0ff" font-size="8" text-anchor="middle">HERO_MEET_X 180</text>
    <text x="430" y="318" fill="#7de0ff" font-size="8" text-anchor="middle">PENGUIN_X 430</text>
    <!-- bob indicador -->
    <g stroke="#ffd94a" stroke-width="1" fill="none" opacity="0.8">
      <line x1="466" y1="238" x2="466" y2="252"/>
      <polyline points="463,241 466,238 469,241"/>
      <polyline points="463,249 466,252 469,249"/>
    </g>
    <text x="474" y="248" fill="#ffd94a" font-size="8">bob al hablar</text>

    <!-- caja de dialogo: drawDialogue ya existe, 384x122 en (128, 232) -->
    <rect x="128" y="232" width="384" height="122" fill="#f0dcb4" stroke="#8a6d3f" stroke-width="2" opacity="0.95"/>
    <text x="208" y="250" fill="#4a3520" font-size="9">MENTOR 🐧</text>
    <text x="320" y="282" fill="#4a3520" font-size="12" text-anchor="middle">Vos elegís la característica de la nube</text>
    <text x="320" y="298" fill="#4a3520" font-size="12" text-anchor="middle">que resuelve ESE problema. Con 1-4 o</text>
    <text x="320" y="314" fill="#4a3520" font-size="12" text-anchor="middle">con un clic.</text>
    <text x="460" y="342" fill="#8a6d3f" font-size="8">▼ ESPACIO</text>

    <text x="628" y="24" fill="#9fb6d8" font-size="9" text-anchor="end">T para saltear</text>
    <rect width="640" height="360" fill="none" stroke="#3d4763" stroke-width="1"/>
  </g>

  <g font-size="10" fill="#7de0ff">
    <text x="30" y="858">La caja de diálogo NO se programa: drawDialogue() de drawScreens.js ya hace wrap, nombre y parpadeo.</text>
  </g>

  <!-- ============ PASO 3: WALK_OUT ============ -->
  <text x="30" y="896" fill="#9fb6d8" font-size="13">PASO 3 — WALK_OUT · el héroe se va y arranca el combate, SIN input</text>

  <g transform="translate(30,908)">
    <use href="#bg"/>
    <use href="#peng"/>
    <!-- heroe saliendo por la derecha -->
    <g transform="translate(560,300)" opacity="0.9"><use href="#hero"/></g>
    <g stroke="#ffd94a" stroke-width="2" fill="none">
      <line x1="582" y1="286" x2="628" y2="286"/>
      <polyline points="620,281 628,286 620,291"/>
    </g>
    <text x="576" y="270" fill="#ffd94a" font-size="9" text-anchor="end">heroX: 180 → 700 (HERO_EXIT_X)</text>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#7de0ff" stroke-width="1" stroke-dasharray="5 4" opacity="0.4"/>
    <rect width="640" height="360" fill="none" stroke="#3d4763" stroke-width="1"/>
  </g>

  <!-- flujo -->
  <g font-size="10">
    <text x="30" y="1292" fill="#5f6b85">Sub-máquina en G.intro (init perezoso, NO variable de módulo — así R resetea gratis):</text>
  </g>
  <g transform="translate(30,1246)" font-size="9">
    <rect x="0" y="0" width="96" height="26" rx="3" fill="#101528" stroke="#7de0ff" stroke-width="1"/>
    <text x="48" y="17" fill="#7de0ff" text-anchor="middle">WALK_IN</text>
    <line x1="96" y1="13" x2="130" y2="13" stroke="#3d4763" stroke-width="1"/>
    <polyline points="124,9 130,13 124,17" fill="none" stroke="#3d4763"/>
    <rect x="130" y="0" width="96" height="26" rx="3" fill="#101528" stroke="#ffd94a" stroke-width="1"/>
    <text x="178" y="17" fill="#ffd94a" text-anchor="middle">TALK</text>
    <text x="178" y="-6" fill="#5f6b85" text-anchor="middle">ESPACIO ×5</text>
    <line x1="226" y1="13" x2="260" y2="13" stroke="#3d4763" stroke-width="1"/>
    <polyline points="254,9 260,13 254,17" fill="none" stroke="#3d4763"/>
    <rect x="260" y="0" width="96" height="26" rx="3" fill="#101528" stroke="#7de0ff" stroke-width="1"/>
    <text x="308" y="17" fill="#7de0ff" text-anchor="middle">WALK_OUT</text>
    <line x1="356" y1="13" x2="390" y2="13" stroke="#3d4763" stroke-width="1"/>
    <polyline points="384,9 390,13 384,17" fill="none" stroke="#3d4763"/>
    <rect x="390" y="0" width="130" height="26" rx="3" fill="#1c2440" stroke="#7dff7d" stroke-width="1"/>
    <text x="455" y="17" fill="#7dff7d" text-anchor="middle">startRound() → COMBATE</text>
    <text x="560" y="17" fill="#9fb6d8">T salta acá ↑</text>
  </g>
</svg>
