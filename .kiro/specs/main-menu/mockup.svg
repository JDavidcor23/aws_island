<svg xmlns="http://www.w3.org/2000/svg" width="700" height="880" viewBox="0 0 700 880" font-family="monospace">
  <rect width="700" height="880" fill="#0b0b12"/>

  <!-- ============ ESTADO 1: MENU ============ -->
  <text x="30" y="34" fill="#9fb6d8" font-size="13">ESTADO 1 — Menú (foco en JUGAR)</text>

  <g transform="translate(30,48)">
    <!-- fondo simulado: isla antes, tonos oxido/gris -->
    <rect width="640" height="360" fill="#2b2333"/>
    <rect y="230" width="640" height="130" fill="#3a3226"/>
    <rect x="380" y="90" width="150" height="180" fill="#4a4038"/>
    <rect x="395" y="105" width="40" height="26" fill="#5c5145"/>
    <rect x="450" y="105" width="40" height="26" fill="#5c5145"/>
    <rect x="395" y="145" width="40" height="26" fill="#5c5145"/>
    <rect x="450" y="145" width="40" height="26" fill="#5c5145"/>
    <circle cx="470" cy="200" r="7" fill="#ff5544" opacity="0.8"/>
    <circle cx="500" cy="200" r="7" fill="#ff5544" opacity="0.8"/>
    <!-- velo -->
    <rect width="640" height="360" fill="#040614" opacity="0.55"/>

    <!-- titulo -->
    <text x="320" y="104" fill="#7de0ff" font-size="40" font-weight="bold" text-anchor="middle" letter-spacing="4">CLOUD QUEST</text>
    <text x="320" y="132" fill="#ffffff" font-size="13" text-anchor="middle">Isla 0 — Fundamentos de la Nube</text>

    <!-- opciones -->
    <text x="268" y="212" fill="#ffd94a" font-size="20" font-weight="bold">▶</text>
    <text x="296" y="212" fill="#ffd94a" font-size="20" font-weight="bold" letter-spacing="2">JUGAR</text>
    <text x="296" y="250" fill="#ffffff" font-size="15">CÓMO SE JUEGA</text>
    <text x="296" y="284" fill="#ffffff" font-size="15">CRÉDITOS</text>

    <!-- hint -->
    <text x="320" y="336" fill="#9fb6d8" font-size="10" text-anchor="middle">↑↓ mover · ENTER elegir</text>

    <rect width="640" height="360" fill="none" stroke="#3d4763" stroke-width="1"/>
  </g>

  <!-- anotaciones estado 1 -->
  <g font-size="10" fill="#9fb6d8">
    <text x="30" y="436">Título #7de0ff · Subtítulo #ffffff · Opción enfocada: caret ▶ + #ffd94a · Hint #9fb6d8</text>
    <text x="30" y="452">Fondo: scene_island_before.png + velo rgba(4,6,20,.55) · image-rendering: pixelated</text>
    <text x="30" y="468">Opciones = &lt;button&gt; reales. Foco por defecto en JUGAR. ↑↓ con wrap-around.</text>
  </g>

  <!-- ============ ESTADO 2: PANEL ============ -->
  <text x="30" y="500" fill="#9fb6d8" font-size="13">ESTADO 2 — Panel abierto (CÓMO SE JUEGA · Escape vuelve)</text>

  <g transform="translate(30,514)">
    <rect width="640" height="360" fill="#2b2333"/>
    <rect y="230" width="640" height="130" fill="#3a3226"/>
    <rect x="380" y="90" width="150" height="180" fill="#4a4038"/>
    <rect width="640" height="360" fill="#040614" opacity="0.72"/>

    <text x="320" y="52" fill="#7de0ff" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">CÓMO SE JUEGA</text>

    <!-- panel -->
    <rect x="72" y="76" width="496" height="212" fill="#101528" stroke="#3d4763" stroke-width="2" rx="3"/>

    <!-- controles -->
    <rect x="98" y="100" width="112" height="22" fill="#1c2440" stroke="#7de0ff" stroke-width="1" rx="2"/>
    <text x="154" y="115" fill="#7de0ff" font-size="11" text-anchor="middle">1-4 o clic</text>
    <text x="228" y="115" fill="#ffffff" font-size="12">Elegir carta</text>

    <rect x="98" y="132" width="112" height="22" fill="#1c2440" stroke="#7de0ff" stroke-width="1" rx="2"/>
    <text x="154" y="147" fill="#7de0ff" font-size="11" text-anchor="middle">ESPACIO</text>
    <text x="228" y="147" fill="#ffffff" font-size="12">Avanzar diálogo · Bloquear</text>

    <rect x="98" y="164" width="112" height="22" fill="#1c2440" stroke="#7de0ff" stroke-width="1" rx="2"/>
    <text x="154" y="179" fill="#7de0ff" font-size="11" text-anchor="middle">R</text>
    <text x="228" y="179" fill="#ffffff" font-size="12">Reiniciar</text>

    <!-- cuerpo -->
    <text x="98" y="216" fill="#cfd8ea" font-size="11">El jefe grita un PROBLEMA. Elegí la carta de la nube que lo</text>
    <text x="98" y="234" fill="#cfd8ea" font-size="11">resuelve. Después bloqueá el ataque en el momento justo:</text>
    <text x="98" y="252" fill="#cfd8ea" font-size="11">cuanto más preciso, más carga tu especial.</text>

    <text x="320" y="322" fill="#ffd94a" font-size="14" text-anchor="middle" font-weight="bold">◀ VOLVER (ESC)</text>

    <rect width="640" height="360" fill="none" stroke="#3d4763" stroke-width="1"/>
  </g>
</svg>
